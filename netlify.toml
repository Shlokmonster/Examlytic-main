# ==============================================================================
# EXAMLYTIC — NETLIFY PRODUCTION DEPLOYMENT CONFIGURATION
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single Page Application (SPA) redirect rule for React Router 7
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Recommended security headers for exam proctoring & WebRTC integrity
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self)"

